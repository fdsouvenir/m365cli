# Adapted from opensrc/repos/github.com/steipete/gogcli/.github/workflows/ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run CI checks
        run: make ci
      - name: Build and check generated skills
        run: |
          make build
          python3 scripts/generate-skills.py --check
      - name: Vet
        run: go vet -mod=readonly ./...

  darwin-cgo-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -mod=readonly ./...
      - name: Build (Keychain / cgo)
        run: CGO_ENABLED=1 go build -mod=readonly ./cmd/m365cli
