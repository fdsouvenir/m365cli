# Adapted from opensrc/repos/github.com/steipete/gogcli/.goreleaser.yaml.
version: 2

project_name: m365cli

changelog:
  disable: true

builds:
  - id: m365cli
    main: ./cmd/m365cli
    binary: m365cli
    ldflags: >-
      -s -w
      -X github.com/fdsouvenir/m365cli/internal/cmd.version={{ .Tag }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    targets:
      - linux_amd64
      - linux_arm64
  - id: m365cli_darwin
    main: ./cmd/m365cli
    binary: m365cli
    ldflags: >-
      -s -w
      -X github.com/fdsouvenir/m365cli/internal/cmd.version={{ .Tag }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=readonly
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - m365cli
      - m365cli_darwin
    files:
      - README.md
      - NOTICE
      - skills/**/*
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
