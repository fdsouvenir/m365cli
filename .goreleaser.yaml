# Adapted from opensrc/repos/github.com/steipete/gogcli/.goreleaser.yaml.
version: 2

project_name: m365cli

changelog:
  disable: true

builds:
  - id: m365cli
    main: ./cmd/m365cli
    binary: m365cli
    ldflags: >-
      -s -w
      -X github.com/fdsouvenir/m365cli/internal/cmd.version={{ .Tag }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=vendor
    targets:
      - linux_amd64
      - linux_arm64
  - id: mog_windows
    main: ./cmd/m365cli
    binary: m365cli
    ldflags: >-
      -s -w
      -X github.com/fdsouvenir/m365cli/internal/cmd.version={{ .Tag }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=vendor
    targets:
      - windows_amd64
  - id: mog_darwin
    main: ./cmd/m365cli
    binary: m365cli
    ldflags: >-
      -s -w
      -X github.com/fdsouvenir/m365cli/internal/cmd.version={{ .Tag }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.commit={{ .ShortCommit }}
      -X github.com/fdsouvenir/m365cli/internal/cmd.date={{ .Date }}
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=vendor
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    builds:
      - m365cli
      - mog_darwin
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: windows
    builds:
      - mog_windows
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # m365cli-wam.exe (amd64) must be pre-built by CI before goreleaser runs.
      # Build with: uv tool run --python 3.12 --with "msal[broker]>=1.20,<2" pyinstaller --onefile --name m365cli-wam scripts/wam/wam_auth.py
      - src: dist/wam/m365cli-wam.exe
        strip_parent: true

checksum:
  name_template: checksums.txt
